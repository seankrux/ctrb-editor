name: Smoke Tests - Production

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    defaults:
      run:
        working-directory: ./nextjs-migration
    env:
      PRODUCTION_URL: ${{ github.event.deployment_status.environment_url || 'https://nextjs-migration-theta.vercel.app' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: nextjs-migration/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against deployment
        run: npm test -- --grep "@smoke"
        env:
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report
          path: nextjs-migration/playwright-report/
          retention-days: 30
