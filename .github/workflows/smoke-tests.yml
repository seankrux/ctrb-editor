name: Smoke Tests - Production
on:
  workflow_run:
    workflows: [Cloudflare deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    name: Cloudflare production pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed editor pages
        run: |
          for path in / /ctrb_web_editor_v5.html /ctrb_web_editor_v4.html; do
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 \
              "https://ctrb-editor.seanllms.workers.dev$path" --output /tmp/editor.html
            python3 -c 'from pathlib import Path; assert "CTRBooster" in Path("/tmp/editor.html").read_text()'
            echo "$path HTTP 200"
          done
