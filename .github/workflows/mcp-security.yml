name: MCP dependency validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'archive/CTRBooster-Editor/ctrb-pleper-mcp/**'
      - '.github/workflows/mcp-security.yml'
  push:
    branches: [main]
    paths:
      - 'archive/CTRBooster-Editor/ctrb-pleper-mcp/**'
      - '.github/workflows/mcp-security.yml'
permissions:
  contents: read
jobs:
  mcp:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CLOUDFLARE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive/CTRBooster-Editor/ctrb-pleper-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/CTRBooster-Editor/ctrb-pleper-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
      - run: npm audit --audit-level=low
