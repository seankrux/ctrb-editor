name: Cloudflare deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate
        run: |
          node scripts/build-cloudflare.mjs
      - name: Validate Worker bundle
        run: npx --yes wrangler@4.153.0 deploy --dry-run --outdir /tmp/cloudflare-build
      - name: Deploy to personal Cloudflare account
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4.153.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7a7a08127b6d6744c838413b4473ecf1
