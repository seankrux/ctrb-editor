name: E2E Tests - Playwright

on:
  push:
    branches: [main, develop]
    paths:
      - 'nextjs-migration/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'nextjs-migration/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: E2E Tests
    runs-on: ${{ vars.CLOUDFLARE_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./nextjs-migration
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: nextjs-migration/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install
          else
            npx playwright install --with-deps
          fi

      - name: Build Next.js app
        run: npm run build

      - name: Run Playwright tests
        run: npm test

      - name: Record playwright-report artifact evidence
        if: always()
        working-directory: .
        run: python3 scripts/artifact_store.py inspect --root nextjs-migration/playwright-report/ --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --group playwright-report

      - name: Preserve and read back private playwright-report artifact
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/artifact_store.py publish --root nextjs-migration/playwright-report/ --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --group playwright-report
          python3 scripts/artifact_store.py download --root "$RUNNER_TEMP/verify-playwright-report" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --group playwright-report

      - name: Record playwright-logs artifact evidence
        if: failure()
        working-directory: .
        run: python3 scripts/artifact_store.py inspect --root nextjs-migration/test-results/ --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --group playwright-logs

      - name: Preserve and read back private playwright-logs artifact
        if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/artifact_store.py publish --root nextjs-migration/test-results/ --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --group playwright-logs
          python3 scripts/artifact_store.py download --root "$RUNNER_TEMP/verify-playwright-logs" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --group playwright-logs
