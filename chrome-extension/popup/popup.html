<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #282c34;
      color: #abb2bf;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: linear-gradient(135deg, #61afef, #98c379);
      border-radius: 8px;
      margin-bottom: 16px;
      color: #282c34;
    }
    .header svg { width: 28px; height: 28px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #21252b;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #98c379;
    }
    .status-dot.inactive { background: #e06c75; }
    .actions { display: grid; gap: 8px; }
    .btn {
      background: #3e4451;
      border: 1px solid #5c6370;
      color: #abb2bf;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: all 0.2s;
    }
    .btn:hover {
      border-color: #61afef;
      color: #61afef;
    }
    .btn-primary {
      background: #61afef;
      color: #282c34;
      border: none;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #4d9feb;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #3e4451;
      font-size: 11px;
      color: #5c6370;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="#282c34" stroke-width="2">
      <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
      <path d="M9 12a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
      <path d="M15 12a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
    </svg>
    <h1>CTRBooster AI</h1>
  </div>

  <div class="status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Checking...</span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="open-devtools">🔧 Open DevTools Panel</button>
    <button class="btn" id="open-editor">📊 Open Campaign Editor</button>
    <button class="btn" id="configure-ai">⚙️ Configure AI</button>
  </div>

  <div class="footer">
    v4.6 • CTRBooster AI Assistant
  </div>

  <script src="popup.js"></script>
</body>
</html>
