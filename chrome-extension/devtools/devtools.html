<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CTRBooster AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #282c34;
      color: #abb2bf;
      padding: 12px;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: linear-gradient(135deg, #61afef, #98c379);
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #282c34;
    }

    .header-title svg {
      width: 20px;
      height: 20px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #98c379;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      background: #21252b;
      border-radius: 6px;
      border: 1px solid #3e4451;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      display: flex;
      gap: 8px;
      max-width: 85%;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3e4451;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar svg {
      width: 16px;
      height: 16px;
      stroke: #abb2bf;
    }

    .message.user .avatar {
      background: #61afef;
    }

    .message.user .avatar svg {
      stroke: #282c34;
    }

    .bubble {
      background: #3e4451;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.4;
      max-width: 100%;
      overflow-wrap: break-word;
    }

    .message.user .bubble {
      background: #61afef;
      color: #282c34;
    }

    .message.system .bubble {
      background: rgba(229, 192, 123, 0.1);
      border: 1px solid #e5c07b;
      color: #e5c07b;
    }

    .chat-input-container {
      padding: 12px;
      border-top: 1px solid #3e4451;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: #282c34;
      border: 1px solid #3e4451;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #abb2bf;
      font-family: inherit;
    }

    .chat-input:focus {
      outline: none;
      border-color: #61afef;
    }

    .chat-input::placeholder {
      color: #5c6370;
    }

    .send-btn {
      background: #61afef;
      border: none;
      color: #282c34;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background: #4d9feb;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
    }

    .quick-actions {
      padding: 8px 12px;
      border-top: 1px solid #3e4451;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .action-btn {
      background: #3e4451;
      border: 1px solid #5c6370;
      color: #abb2bf;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      border-color: #61afef;
      color: #61afef;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #abb2bf;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }

    .config-notice {
      background: rgba(224, 108, 117, 0.1);
      border: 1px solid #e06c75;
      color: #e06c75;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      display: none;
    }

    .config-notice button {
      background: #e06c75;
      color: #282c34;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin-top: 8px;
      font-weight: 600;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #21252b;
    }

    ::-webkit-scrollbar-thumb {
      background: #3e4451;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #5c6370;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="#282c34" stroke-width="2">
        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
        <path d="M9 12a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
        <path d="M15 12a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
      </svg>
      CTRBooster AI
    </div>
    <div class="status-indicator" title="Connected"></div>
  </div>

  <div class="config-notice" id="config-notice">
    ⚠️ AI not configured. Please set up your API key in the main editor.
    <button onclick="openMainEditor()">Open Editor</button>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chat-messages">
      <!-- Messages will be added here -->
    </div>
    <div class="quick-actions">
      <button class="action-btn" onclick="sendQuickAction('Show campaign stats')">📊 Stats</button>
      <button class="action-btn" onclick="sendQuickAction('Create GMap campaign')">🗺️ GMap</button>
      <button class="action-btn" onclick="sendQuickAction('Create GSearch campaign')">🔍 GSearch</button>
      <button class="action-btn" onclick="sendQuickAction('Check campaign health')">✅ Health Check</button>
    </div>
    <div class="chat-input-container">
      <input type="text" class="chat-input" id="chat-input" placeholder="Ask AI about your campaigns..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#282c34" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="devtools.js"></script>
</body>
</html>
